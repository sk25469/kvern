[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kvern"
version = "0.1.0"
description = "LLM KV Cache Manager using token-level Trie optimization"
authors = [
    {name = "Sahil", email = "sahil@example.com"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License", 
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0", 
    "httpx>=0.24.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "streamlit>=1.25.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0.0",
    "asyncio-lock>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/username/kvern"
Documentation = "https://github.com/username/kvern/tree/main/docs"
Repository = "https://github.com/username/kvern"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[project.scripts]
kvern = "kvern.main:main"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = true