<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KVern - Stop Paying the Stateless Tax</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Hero Section -->
    <section id="hero" class="hero-section">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title">
                    Stop Paying the <span class="accent-text">Stateless Tax</span>
                </h1>
                <p class="hero-subtitle">
                    KVern is a transparent proxy that adds a persistent intelligence layer to your LLM stack. 
                    Track prefix reuse, visualize your trie, and unlock theoretical compute savings with zero code changes.
                </p>
                
                <div class="hero-buttons">
                    <button class="btn-primary" id="clone-btn">
                        <span class="mono-text">$ git clone kvern</span>
                        <svg class="copy-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M3.5 2a.5.5 0 0 0-.5.5v11a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5v-11a.5.5 0 0 0-.5-.5h-9zm0-1h9a1.5 1.5 0 0 1 1.5 1.5v11a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5v-11A1.5 1.5 0 0 1 3.5 1z"/>
                        </svg>
                    </button>
                    <button class="btn-secondary">
                        Explore Interactive Demo
                    </button>
                </div>
            </div>
            
            <div class="hero-visual">
                <div class="trie-animation">
                    <div class="token-flow">
                        <div class="token"></div>
                        <div class="token"></div>
                        <div class="token"></div>
                    </div>
                    <div class="trie-structure">
                        <div class="trie-node root">
                            <div class="trie-node child hit">
                                <div class="trie-node child">
                                    <div class="trie-node child"></div>
                                </div>
                            </div>
                            <div class="trie-node child">
                                <div class="trie-node child"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="scripts/main.js"></script>
    <script src="scripts/animations.js"></script>
</body>
</html>
